name: Build APK
on:
  push:
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        working-directory: android
        run: gradle assembleStableRelease assembleBetaRelease --no-daemon
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/stable/release/app-stable-release.apk Tasrif.apk
          cp android/app/build/outputs/apk/beta/release/app-beta-release.apk Tasrif-beta.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tasrif APK ${{ github.run_number }}
          make_latest: true
          files: |
            Tasrif.apk
            Tasrif-beta.apk
