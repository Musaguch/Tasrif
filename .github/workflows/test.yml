name: Emulator test
on:
  push:
    paths: [".github/workflows/test.yml", "android/test-trigger"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { api: [30, 35] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: cd android && gradle assembleRelease --no-daemon
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n io.github.musaguch.tasrif/.MainActivity
            sleep 25
            echo "=== PID ==="; adb shell pidof io.github.musaguch.tasrif || echo "NOT RUNNING"
            echo "=== CRASH ==="; adb logcat -d -b crash || true
            echo "=== LOG ==="; adb logcat -d | grep -iE "tasrif|AndroidRuntime|chromium|FATAL" | tail -80 || true
            adb exec-out screencap -p > shot.png; echo "=== SHOT ==="; base64 -w0 shot.png; echo; echo "=== END ==="
