plugins { id "com.android.application" }
android {
    namespace "io.github.musaguch.tasrif"
    compileSdk 35
    defaultConfig {
        applicationId "io.github.musaguch.tasrif"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file("../tasrif.keystore")
            storePassword "tasrif2026"
            keyAlias "tasrif"
            keyPassword "tasrif2026"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
