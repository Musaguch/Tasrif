plugins { id "com.android.application" }
android {
    namespace "io.github.musaguch.tasrif"
    compileSdk 35
    defaultConfig {
        applicationId "io.github.musaguch.tasrif"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }
    buildFeatures { buildConfig true }
    flavorDimensions "channel"
    productFlavors {
        stable {
            dimension "channel"
            buildConfigField "String", "START_URL", '"https://musaguch.github.io/Tasrif/"'
            resValue "string", "app_name", "Тасриф"
        }
        beta {
            dimension "channel"
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            buildConfigField "String", "START_URL", '"https://musaguch.github.io/Tasrif/beta/"'
            resValue "string", "app_name", "Тасриф β"
        }
    }
    signingConfigs {
        release {
            storeFile file("../tasrif.keystore")
            storePassword "tasrif2026"
            keyAlias "tasrif"
            keyPassword "tasrif2026"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
